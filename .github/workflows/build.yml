name: Build Firmware

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload binaries to (e.g. v1.7.0). Leave blank to skip upload.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-v1

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32 || arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "sACN"
          if [ ! -d ~/Arduino/libraries/AsyncTCP ]; then
            git clone https://github.com/mathieucarbou/AsyncTCP.git ~/Arduino/libraries/AsyncTCP
          fi
          if [ ! -d ~/Arduino/libraries/ESPAsyncWebServer ]; then
            git clone https://github.com/mathieucarbou/ESPAsyncWebServer.git ~/Arduino/libraries/ESPAsyncWebServer
          fi

      - name: Compile sketch
        run: |
          mv Sketch.ino OneFader.ino
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=default \
            --export-binaries \
            --output-dir build \
            .

      - name: Merge bootloader, partition table, and firmware
        run: |
          pip install esptool
          python -m esptool --chip esp32s3 merge_bin \
            -o build/OneFader.ino.merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 4MB \
            --fill-flash-size 4MB \
            0x0000  build/OneFader.ino.bootloader.bin \
            0x8000  build/OneFader.ino.partitions.bin \
            0xe000  $(find ~/.arduino15 -name "boot_app0.bin" | head -1) \
            0x10000 build/OneFader.ino.bin

      - name: Rename binaries for release
        run: |
          cp build/OneFader.ino.bin         build/onefader-webversion.bin
          cp build/OneFader.ino.merged.bin  build/OneFader.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: |
            build/OneFader.bin
            build/onefader-webversion.bin

      - name: Upload binaries to release
        if: github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            build/OneFader.bin
            build/onefader-webversion.bin
